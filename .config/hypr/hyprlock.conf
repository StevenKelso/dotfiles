general {
    hide_cursor = true
    ignore_empty_input = false
    fractional_scaling = 2
    screencopy_mode = 0
    fail_timeout = 2000
}

# Background
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(ffffffee)
    font_size = 96
    font_family = iosevka nerd font
    position = 0, 100
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(ffffffbb)
    font_size = 24
    font_family = iosevka nerd font
    position = 0, 10
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text = $USER
    color = rgba(ffffffcc)
    font_size = 20
    font_family = iosevka nerd font
    position = 0, -100
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true

    outer_color = rgba(ffffff55)
    inner_color = rgba(00000066)
    font_color = rgba(ffffffff)

    fade_on_empty = false
    placeholder_text = <i>Enter password...</i>

    position = 0, -180
    halign = center
    valign = center
}
